# Once a week (and when asked): ned under AddressSanitizer, fed random keys — memory errors that Nim's own checks do
# not see (a copyMem past the end, a use after free behind a cast or across threads) stop it with a report.
#
#   fuzz (AddressSanitizer) — a build with stack traces, bounds checks and gcc's -fsanitize=address, then
#                             tests/fuzz/batch.sh on six modes; fails on a crash, a hang, an internal error or a
#                             sanitizer report (uploaded with the fuzzer's logs)
#   parsers (fuzzed)        — every reader and formatter (Nim, C, NIF, JSON, CSS, HTML, SQL, Markdown, YAML, TOML) fed
#                             broken text for minutes each, under AddressSanitizer and UBSan, with a new seed each
#                             week; the inputs that crash one are uploaded
#   nimony (newest)         — Nim 3's compiler as it is this week, built from its main branch, and ned's Nim 3 tests
#                             with it: what changed in nimony and what ned must follow shows here, not on a tablet
#   agents (sandboxed)      — the real agents ned offers (Claude Agent, Codex, Gemini CLI, Copilot) as they are this
#                             week, each started in ned's sandbox for agents in an empty home: initialize and
#                             session/new answered, nothing refused — no prompt is ever sent (tests/ai/tagents.py)

name: weekly

on:
  schedule:
    - cron: "17 3 * * 1"         # (Mondays, 03:17 UTC)
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "seconds of fuzzing for each mode"
        default: "240"
      parser_seconds:
        description: "seconds of fuzzing for each reader and formatter"
        default: "150"

permissions:
  contents: read

jobs:
  fuzz-asan:
    name: fuzz (AddressSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Build with AddressSanitizer
        run: >
          nim c --stackTrace:on --lineTrace:on --checks:on --hints:off
          --passC:"-fsanitize=address -fno-omit-frame-pointer" --passL:"-fsanitize=address"
          -o:ned_asan src/ned.nim
      - name: Fuzz
        env:
          NEDBIN: ./ned_asan
          # (no leak check: ned leaves without freeing what it holds; its own crash note keeps SIGSEGV)
          ASAN_OPTIONS: detect_leaks=0:handle_segv=0:log_path=/tmp/ned-asan/report
        run: |
          mkdir -p /tmp/ned-asan
          code=0
          tests/fuzz/batch.sh ${{ inputs.fuzz_seconds || '240' }} mixed palette hex vim helix c || code=$?
          if ls /tmp/ned-asan/report.* >/dev/null 2>&1; then
            echo "::error::AddressSanitizer reported a memory error"
            head -80 /tmp/ned-asan/report.*
            code=1
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-asan-logs
          path: |
            /tmp/ned-fuzz-*-logs
            /tmp/ned-asan

  fuzz-parsers:
    name: parsers (fuzzed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: >
          nim c -d:release --checks:on --hints:off -d:useMalloc
          --passC:"-fsanitize=address,undefined -fno-sanitize=null -fno-omit-frame-pointer"
          --passL:"-fsanitize=address,undefined"
          -r tests/fuzz/parsers.nim ${{ inputs.parser_seconds || '150' }} "$(date +%Y%m%d)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-parsers-found
          path: tests/fuzz/found

  agents:
    name: agents (sandboxed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: nim c -d:release --hints:off -o:ned src/ned.nim
      - name: The agents in the sandbox
        run: python3 tests/ai/tagents.py ./ned

  nimony:
    name: nimony (newest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Build nimony from its main branch
        run: |
          git clone -q --depth 1 https://github.com/nim-lang/nimony ~/.local/nimony
          cd ~/.local/nimony
          git submodule update --init --depth 1
          nim c --hints:off -d:release src/hastur/hastur.nim
          for t in nifler nimony lengc niflink nifmake pnak nifler2; do ./bin/hastur build $t; done
          printf 'import std/syncio\necho 1 + 1\n' > /tmp/probe.nim && ./bin/nimony check /tmp/probe.nim
          echo "$HOME/.local/nimony/bin" >> "$GITHUB_PATH"
          git log -1 --format='nimony at %h, %cs: %s'
      - name: Build ned
        run: nim c -d:release --hints:off -o:ned src/ned.nim
      - name: ned's Nim 3 tests
        env:
          NED_UI_FULL: "1"
        run: python3 tests/ui/run.py ./ned t_612_nim3 t_627_nim3_contracts t_628_hastur_tests t_637_nim3_typing
